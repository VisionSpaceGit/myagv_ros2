controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:
    left_wheel_names:
      - front_left_wheel_joint
      - rear_left_wheel_joint
    right_wheel_names:
      - front_right_wheel_joint
      - rear_right_wheel_joint
    
    wheel_separation: 0.2105
    wheel_radius: 0.04
    wheels_per_side: 2
    # wheels_per_side: 1
    
    wheel_separation_multiplier: 1.0
    # wheel_radius_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    open_loop: true
    
    # enable_odom_tf: true
    enable_odom_tf: false
    # odom_frame_id: odom
    # base_frame_id: base_footprint

    publish_rate: 50.0
    cmd_vel_timeout: 0.5
    use_stamped_vel: false
    
    linear:
      x:
        has_velocity_limits: true
        max_velocity: 2.0
        min_velocity: -2.0
        has_acceleration_limits: true
        max_acceleration: 20.0
        min_acceleration: -20.0
    angular:
      z:
        has_velocity_limits: true
        max_velocity: 4.0
        min_velocity: -4.0
        has_acceleration_limits: true
        max_acceleration: 25.0
        min_acceleration: -25.0

    pose_covariance_diagonal : [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    # pose_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.03]
    # twist_covariance_diagonal: [0.001, 0.001, 0.001, 1000000.0, 1000000.0, 0.03]

    # pose_covariance_diagonal: [0.001, 0.001, 9999999.0, 9999999.0, 9999999.0, 0.01]
    # twist_covariance_diagonal: [0.001, 0.001, 9999999.0, 9999999.0, 9999999.0, 0.01]
    # twist_covariance_diagonal: [0.001, 0.001, 0.001, 9999999.0, 9999999.0, 0.01]
