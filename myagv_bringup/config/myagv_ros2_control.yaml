controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:
    left_wheel_names:
      - front_left_wheel_joint
      - rear_left_wheel_joint
    right_wheel_names:
      - front_right_wheel_joint
      - rear_right_wheel_joint
    wheel_separation: 0.2111
    wheel_radius: 0.04
    wheel_separation_multiplier: 1.0
    wheel_radius_multiplier: 1.0
    cmd_vel_timeout: 0.5
    publish_rate: 50.0
    # enable_odom_tf: true
    publish_tf: true
    odom_frame_id: odom
    # base_frame_id: base_footprint
    base_frame_id: base_link
    odom_frame_velocity: false
    use_stamped_vel: true
    velocity_rolling_window_size: 10
    linear:
      x:
        has_velocity_limits: true
        max_velocity: 0.6
        min_velocity: -0.6
        has_acceleration_limits: true
        max_acceleration: 1.0
        min_acceleration: -1.0
    angular:
      z:
        has_velocity_limits: true
        max_velocity: 1.5
        min_velocity: -1.5
        has_acceleration_limits: true
        max_acceleration: 3.0
        min_acceleration: -3.0
    pose_covariance_diagonal: [0.001, 0.001, 9999999.0, 9999999.0, 9999999.0, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 9999999.0, 9999999.0, 9999999.0, 0.01]
